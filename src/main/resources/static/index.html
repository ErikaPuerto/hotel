<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Manager</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>HOTEL MANAGER</h1>

            <div class="usuario-box">
                <label>Rol:</label>

                <select id="selectorRol">
                    <option value="admin">Administrador</option>
                    <option value="empleado">Empleado</option>
                    <option value="cliente">Cliente</option>
                </select>
            </div>
        </header>

        <nav>
            <button onclick="mostrarSeccion('clientes')">Clientes</button>
            <button onclick="mostrarSeccion('habitaciones')">Habitaciones</button>
            <button onclick="mostrarSeccion('reservas')">Reservas</button>
            <button onclick="mostrarSeccion('pagos')">Pagos</button>
        </nav>

        <main>

            <!-- CLIENTES -->

            <section id="clientes" class="seccion oculto">

                <h2>Clientes</h2>

                <button onclick="cargarClientes()">
                    Cargar Clientes
                </button>

                <div class="formulario">

                    <input type="text"
                           id="clienteUsuario"
                           placeholder="Usuario">

                    <input type="text"
                           id="clienteDocumento"
                           placeholder="Documento">

                    <input type="text"
                           id="clienteTelefono"
                           placeholder="Teléfono">

                    <input type="email"
                           id="clienteCorreo"
                           placeholder="Correo">

                    <button onclick="crearCliente()">
                        Guardar Cliente
                    </button>

                </div>

                <div id="tablaClientes"></div>

            </section>

            <!-- HABITACIONES -->

            <section id="habitaciones" class="seccion oculto">

                <h2>Habitaciones</h2>

                <button onclick="cargarHabitaciones()">
                    Cargar Habitaciones
                </button>

                <div class="formulario">

                    <input type="number"
                           id="habitacionNumero"
                           placeholder="Número">

                    <input type="text"
                           id="habitacionEstado"
                           placeholder="Estado">

                    <input type="number"
                           id="habitacionTipo"
                           placeholder="ID Tipo">

                    <input type="number"
                           id="habitacionSede"
                           placeholder="ID Sede">

                    <button onclick="crearHabitacion()">
                        Guardar Habitación
                    </button>

                </div>

                <div id="tablaHabitaciones"></div>

            </section>

            <!-- RESERVAS -->

            <section id="reservas" class="seccion oculto">

                <h2>Reservas</h2>

                <button onclick="cargarReservas()">
                    Cargar Reservas
                </button>

                <div class="formulario">

                    <input type="date" id="fechaInicio">

                    <input type="date" id="fechaFin">

                    <input type="text"
                           id="estadoReserva"
                           placeholder="Estado">

                    <input type="number"
                           id="idClienteReserva"
                           placeholder="ID Cliente">

                    <input type="number"
                           id="idHabitacionReserva"
                           placeholder="ID Habitación">

                    <input type="number"
                           id="idEmpleadoReserva"
                           placeholder="ID Empleado">

                    <button onclick="crearReserva()">
                        Guardar Reserva
                    </button>

                </div>

                <div id="tablaReservas"></div>

            </section>

            <!-- PAGOS -->

            <section id="pagos" class="seccion oculto">

                <h2>Pagos</h2>

                <button onclick="cargarPagos()">
                    Cargar Pagos
                </button>

                <div class="formulario">

                    <input type="number"
                           id="montoPago"
                           placeholder="Monto">

                    <input type="date"
                           id="fechaPago">

                    <input type="text"
                           id="estadoPago"
                           placeholder="Estado">

                    <input type="number"
                           id="idMetodoPago"
                           placeholder="ID Método">

                    <input type="number"
                           id="idReservaPago"
                           placeholder="ID Reserva">

                    <input type="number"
                           id="idClientePago"
                           placeholder="ID Cliente">

                    <button onclick="crearPago()">
                        Guardar Pago
                    </button>

                </div>

                <div id="tablaPagos"></div>

            </section>

        </main>

    </div>

    <script src="js/app.js"></script>

</body>

</html>
